# ============================================================
#  Online Voting System - configuration
# ============================================================
spring.application.name=online-voting-system
server.port=8080

# ---------- MySQL ----------
# createDatabaseIfNotExist=true -> the voting_db schema is created automatically on first run.
# Override credentials with environment variables DB_USERNAME / DB_PASSWORD if you do not want to edit this file.
spring.datasource.url=jdbc:mysql://localhost:3306/voting_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA / Hibernate ----------
# Hibernate creates/updates the tables from the entity classes (see database/schema.sql for the equivalent SQL).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# After Hibernate builds the tables, run src/main/resources/data.sql (seed data: roles, admin, voters, election, candidates).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---------- JSP view resolver ----------
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ---------- Session / cookie security ----------
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
# Set to true when the site is served over HTTPS (a secure cookie is not sent over plain http).
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
# Keep the session id out of URLs (Spring Security's firewall rejects ;jsessionid URLs)
server.servlet.session.tracking-modes=cookie

# ---------- Error handling ----------
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- Startup safety ----------
# A failing seed statement in data.sql will not stop the application from starting.
spring.sql.init.continue-on-error=true
# DataInitializer re-creates/repairs the admin (admin@voting.com / Admin@123) at startup. Set to false to disable.
app.admin.reset-password=true
